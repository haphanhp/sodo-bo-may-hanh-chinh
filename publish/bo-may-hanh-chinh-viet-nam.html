<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ máy hành chính Việt Nam</title>
<meta name="description" content="giúp người xem hiểu cấu trúc và các đơn vị của bộ máy chính quyền Việt Nam">
<style>
/* css/main.css */
/* main.css — token, reset, typography */
:root{
  --c-bg:#f7f8fa; --c-surface:#ffffff; --c-surface-2:#f1f3f6;
  --c-border:#e2e6ec; --c-text:#1b2129; --c-text-muted:#66707d;
  --c-accent:#c8102e; --c-accent-soft:#fdecef; --c-gold:#d4a017;
  --c-ok:#1f7a4d; --c-warn:#b7791f; --c-err:#c0392b;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.06);
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --h-header:56px; --w-nav:232px; --w-detail:380px;
}
[data-theme="dark"]{
  --c-bg:#11151a; --c-surface:#171c23; --c-surface-2:#1f262f;
  --c-border:#2a323d; --c-text:#e6eaf0; --c-text-muted:#93a0b0;
  --c-accent:#ff5a72; --c-accent-soft:#2a1a20;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0 0 var(--sp-3);line-height:1.3;font-weight:650}
h1{font-size:1.4rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0 0 var(--sp-3)}
a{color:var(--c-accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
code,kbd{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.88em;background:var(--c-surface-2);padding:1px 5px;border-radius:var(--r-sm)}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--c-border);border-radius:8px}

/* css/layout.css */
/* layout.css — khung 3 vùng */
#app-header{
  position:sticky;top:0;z-index:40;height:var(--h-header);
  display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);
  background:var(--c-surface);border-bottom:1px solid var(--c-border);
}
.brand{display:flex;align-items:center;gap:var(--sp-2);font-weight:700;white-space:nowrap}
.brand-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-sm);background:var(--c-accent);color:#fff;font-size:.78rem;letter-spacing:.5px}
.search-box{position:relative;flex:1;max-width:560px;margin:0 auto}
.search-box input{
  width:100%;height:36px;padding:0 64px 0 var(--sp-4);
  background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:999px;
  color:var(--c-text);font:inherit;font-size:.92rem;
}
.search-box input:disabled{cursor:not-allowed;opacity:.75}
.search-hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.68rem;color:var(--c-text-muted);background:var(--c-surface);border:1px solid var(--c-border);border-radius:999px;padding:1px 8px}
#app-body{display:flex;min-height:calc(100vh - var(--h-header))}
#main-nav{
  width:var(--w-nav);flex:0 0 var(--w-nav);display:flex;flex-direction:column;gap:2px;
  padding:var(--sp-3);background:var(--c-surface);border-right:1px solid var(--c-border);
  position:sticky;top:var(--h-header);height:calc(100vh - var(--h-header));overflow:auto;
}
.nav-item{
  display:flex;align-items:center;gap:var(--sp-3);width:100%;padding:9px var(--sp-3);
  background:none;border:0;border-radius:var(--r-md);text-align:left;font-size:.93rem;color:var(--c-text-muted);
}
.nav-item:hover{background:var(--c-surface-2);color:var(--c-text)}
.nav-item.is-active{background:var(--c-accent-soft);color:var(--c-accent);font-weight:600}
.nav-ico{width:18px;text-align:center}
.nav-footer{margin-top:auto;padding-top:var(--sp-4)}
#app{flex:1;min-width:0;padding:var(--sp-5);display:flex;flex-direction:column}
.view-root{flex:1;min-height:0}
.detail-panel{
  width:var(--w-detail);flex:0 0 var(--w-detail);background:var(--c-surface);
  border-left:1px solid var(--c-border);position:sticky;top:var(--h-header);
  height:calc(100vh - var(--h-header));display:flex;flex-direction:column;
}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-4);border-bottom:1px solid var(--c-border)}
.panel-title{margin:0;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--c-text-muted)}
.panel-body{flex:1;overflow:auto;padding:var(--sp-4)}
.detail-panel.is-hidden{display:none}

/* css/components.css */
/* components.css */
.icon-btn{display:grid;place-items:center;width:34px;height:34px;background:none;border:1px solid transparent;border-radius:var(--r-md);color:var(--c-text-muted);font-size:1rem}
.icon-btn:hover{background:var(--c-surface-2);color:var(--c-text)}
.breadcrumbs{min-height:20px;margin-bottom:var(--sp-3);font-size:.85rem;color:var(--c-text-muted)}
.breadcrumbs span+span::before{content:"›";margin:0 6px;opacity:.6}
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.view-head{margin-bottom:var(--sp-4)}
.view-head h1{margin-bottom:4px}
.view-head .sub{color:var(--c-text-muted);font-size:.9rem;margin:0}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  gap:var(--sp-2);min-height:340px;padding:var(--sp-6);
  background:var(--c-surface);border:1px dashed var(--c-border);border-radius:var(--r-lg);
}
.empty-ico{font-size:2.4rem;line-height:1;opacity:.75}
.empty-title{font-weight:650;font-size:1.05rem}
.empty-desc{max-width:52ch;color:var(--c-text-muted);font-size:.92rem;margin:0}
.empty-meta{margin-top:var(--sp-2);display:flex;gap:var(--sp-2);flex-wrap:wrap;justify-content:center}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:600;border:1px solid var(--c-border);background:var(--c-surface-2);color:var(--c-text-muted)}
.badge-accent{background:var(--c-accent-soft);border-color:transparent;color:var(--c-accent)}
.badge-muted{opacity:.85}
.prose{max-width:76ch}
.prose h2{margin-top:var(--sp-5)}
.prose ul,.prose ol{margin:0 0 var(--sp-3);padding-left:1.25rem}
.prose li{margin-bottom:4px}
.toast-root{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 14px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--shadow);font-size:.88rem}
#modal-root:empty{display:none}
.notice{padding:12px 16px;margin-bottom:16px;border-radius:var(--r-md);font-size:.9rem;border:1px solid var(--c-border);background:var(--c-surface)}
.notice-warn{border-color:var(--c-warn);background:var(--c-accent-soft)}
.table-wrap{overflow:auto}
.data-table{width:100%;border-collapse:collapse;font-size:.88rem}
.data-table th{position:sticky;top:0;background:var(--c-surface-2);text-align:left;font-weight:650;padding:10px 12px;border-bottom:1px solid var(--c-border);white-space:nowrap}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--c-border);vertical-align:top}
.data-table tr:last-child td{border-bottom:0}
.data-table tr:hover td{background:var(--c-surface-2)}
.muted-note{color:var(--c-text-muted);font-size:.82rem}
.d-title{font-size:1.02rem;margin-bottom:8px}
.d-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.panel-body h4{margin:18px 0 6px;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--c-text-muted)}
.panel-body ul,.panel-body ol{margin:0;padding-left:1.15rem;font-size:.88rem}
.panel-body li{margin-bottom:5px}
.kv{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--c-border);font-size:.86rem}
.kv .k{flex:0 0 92px;color:var(--c-text-muted)}
.kv .v{flex:1;word-break:break-word}
.src-list li{margin-bottom:9px}
.row-link{cursor:pointer}
.data-table tr.row-link:hover td{background:var(--c-accent-soft)}
.search-results{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:50;max-height:66vh;overflow:auto;
  background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:6px}
.sr-group+.sr-group{border-top:1px solid var(--c-border);margin-top:6px;padding-top:6px}
.sr-head{padding:6px 12px 4px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--c-text-muted);font-weight:700}
.sr-item{display:flex;flex-direction:column;gap:1px;width:100%;padding:7px 12px;background:none;border:0;border-radius:var(--r-md);text-align:left}
.sr-item:hover,.sr-item:focus-visible{background:var(--c-accent-soft)}
.sr-label{font-size:.9rem;font-weight:600}
.sr-sub{font-size:.76rem;color:var(--c-text-muted)}
.sr-empty{padding:16px;font-size:.88rem;color:var(--c-text-muted)}
.panel-body strong[data-entity]{cursor:pointer;border-bottom:1px dotted var(--c-accent)}
.panel-body strong[data-entity]:hover{color:var(--c-accent)}
.wf{list-style:none;margin:0;padding:0;position:relative}
.wf-step{position:relative;padding:0 0 14px 26px;border-left:2px solid var(--c-border);margin-left:6px}
.wf-step:last-child{border-left-color:transparent;padding-bottom:0}
.wf-step::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;
  background:var(--c-surface);border:2px solid var(--c-accent)}
.wf-name{font-weight:650;font-size:.9rem}
.wf-desc{font-size:.84rem;margin-top:3px}
.badge.rel-ok{background:#e6f4ec;border-color:#bfe0cd;color:#1f7a4d}
.badge.rel-mid{background:#fdf3e2;border-color:#f0dcb4;color:#b7791f}
.badge.rel-bad{background:#fdecef;border-color:#f6cdd5;color:#c0392b}
[data-theme="dark"] .badge.rel-ok{background:#14301f;border-color:#1f7a4d;color:#7fd3a6}
[data-theme="dark"] .badge.rel-mid{background:#332612;border-color:#b7791f;color:#e8c07d}
[data-theme="dark"] .badge.rel-bad{background:#331a1f;border-color:#c0392b;color:#f19aa7}
.timebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;margin-bottom:14px;
  background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-lg);font-size:.85rem}
.timebar.is-past{border-color:var(--c-warn);background:var(--c-accent-soft)}
.tb-label{font-weight:650;color:var(--c-text-muted)}
.timebar input[type=date]{font:inherit;padding:4px 8px;border:1px solid var(--c-border);border-radius:var(--r-sm);
  background:var(--c-surface-2);color:var(--c-text)}
.tb-chip{padding:4px 11px;border:1px solid var(--c-border);border-radius:999px;background:var(--c-surface-2);font-size:.78rem;color:var(--c-text-muted)}
.tb-chip:hover{border-color:var(--c-accent);color:var(--c-accent)}
.tb-chip.is-on{background:var(--c-accent);border-color:var(--c-accent);color:#fff;font-weight:600}
.tb-warn{font-size:.78rem;color:var(--c-warn);font-weight:600}

/* css/graph.css */
/* graph.css — placeholder Phase 3 */
.graph-canvas{position:relative;width:100%;height:100%;min-height:420px;border-radius:var(--r-lg);
  background:var(--c-surface);border:1px solid var(--c-border);overflow:hidden}
.graph-canvas::before{content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(var(--c-border) 1px,transparent 1px);background-size:22px 22px}
.graph-toolbar{position:absolute;right:12px;top:12px;z-index:2;display:flex;gap:6px;
  padding:4px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);box-shadow:var(--shadow)}
.graph-node{position:absolute;padding:6px 12px;border-radius:999px;font-size:.8rem;
  background:var(--c-surface-2);border:1px solid var(--c-border);color:var(--c-text-muted)}
.graph-canvas{display:flex;flex-direction:column}
.graph-svg{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
.graph-svg.is-dragging{cursor:grabbing}
.graph-edge{fill:none;stroke:var(--c-border);stroke-width:1.6}
.graph-node-g{cursor:pointer}
.graph-node-g .node-box{fill:var(--c-surface);stroke:var(--c-border);stroke-width:1.4;filter:drop-shadow(0 1px 2px rgba(16,24,40,.08))}
.graph-node-g:hover .node-box{stroke:var(--c-accent)}
.graph-node-g.is-selected .node-box{stroke:var(--c-accent);stroke-width:2.4;fill:var(--c-accent-soft)}
.graph-node-g .node-label{font-size:12.5px;font-weight:650;fill:var(--c-text)}
.graph-node-g .node-sub{font-size:10.5px;fill:var(--c-text-muted)}
.graph-node-g .node-box{stroke-dasharray:none}
.n-legislature .node-box{border:0;stroke:#8e44ad}
.n-government .node-box{stroke:#c8102e}
.n-court .node-box{stroke:#2e86c1}
.n-procuracy .node-box{stroke:#1f7a4d}
.n-ministry .node-box{stroke:var(--c-border)}
.n-agency .node-box{stroke:#d4a017}
.node-toggle{cursor:pointer}
.node-toggle .toggle-bg{fill:var(--c-surface-2);stroke:var(--c-border)}
.node-toggle .toggle-tx{font-size:13px;fill:var(--c-text-muted)}
.graph-legend{position:absolute;left:12px;top:12px;z-index:2;display:flex;flex-wrap:wrap;gap:10px;padding:6px 10px;
  background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-md);font-size:.72rem;color:var(--c-text-muted);box-shadow:var(--shadow)}
.graph-legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:3px;border:2px solid var(--c-border);vertical-align:-1px}
.graph-legend .n-legislature{border-color:#8e44ad}.graph-legend .n-government{border-color:#c8102e}
.graph-legend .n-court{border-color:#2e86c1}.graph-legend .n-procuracy{border-color:#1f7a4d}
.graph-legend .n-agency{border-color:#d4a017}
.graph-hint{position:absolute;left:12px;bottom:10px;z-index:2;font-size:.72rem;color:var(--c-text-muted);background:var(--c-surface);padding:4px 10px;border-radius:999px;border:1px solid var(--c-border)}
.graph-pager .pager-bg{fill:var(--c-surface);stroke:var(--c-border)}
.graph-pager .pager-label{font-size:11px;fill:var(--c-text-muted);font-weight:600}
.graph-pager .pager-btn{cursor:pointer}
.graph-pager .pager-btn text{font-size:15px;fill:var(--c-accent);font-weight:700}
.graph-pager .pager-hit{fill:transparent}
.graph-pager .pager-btn:hover .pager-hit{fill:var(--c-accent-soft)}
.graph-pager .pager-btn.is-disabled{cursor:default;opacity:.3}
.graph-pager .pager-btn.is-disabled:hover .pager-hit{fill:transparent}
.n-municipality .node-box{stroke:#e67e22}
.n-province .node-box{stroke:#16a085}
.graph-legend .n-municipality{border-color:#e67e22}
.graph-legend .n-province{border-color:#16a085}

/* css/responsive.css */
/* responsive.css */
@media (max-width:1180px){
  :root{--w-detail:320px}
}
@media (max-width:980px){
  #app-body{flex-direction:column}
  #main-nav{position:fixed;left:0;top:var(--h-header);height:calc(100vh - var(--h-header));z-index:35;
    transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  #main-nav.is-open{transform:none}
  .detail-panel{position:static;width:100%;flex:1 1 auto;height:auto;border-left:0;border-top:1px solid var(--c-border)}
  #nav-toggle{display:grid}
}
@media (min-width:981px){ #nav-toggle{display:none} }
@media (max-width:640px){
  body{font-size:14px}
  #app{padding:var(--sp-4) var(--sp-4) var(--sp-5)}
  .brand-text{display:none}
  .search-hint{display:none}
}

</style>
</head>
<body>

<header id="app-header">
  <button id="nav-toggle" class="icon-btn" aria-label="Mở menu">☰</button>
  <div class="brand">
    <span class="brand-mark">VN</span>
    <span class="brand-text">Sơ đồ bộ máy hành chính</span>
  </div>
  <div class="search-box">
    <input id="global-search" type="search" placeholder="Tìm cơ quan, người, chức vụ, thủ tục, văn bản…" autocomplete="off" disabled>
    <span class="search-hint">Phase 5</span>
    <div id="search-results" class="search-results" hidden></div>
  </div>
  <button id="theme-toggle" class="icon-btn" aria-label="Đổi giao diện sáng/tối">◐</button>
</header>

<div id="app-body">

  <nav id="main-nav" aria-label="Điều hướng chính">
    <button class="nav-item is-active" data-view="map"><span class="nav-ico">🗺</span> Bản đồ</button>
    <button class="nav-item" data-view="organizations"><span class="nav-ico">🏢</span> Cơ quan</button>
    <button class="nav-item" data-view="people"><span class="nav-ico">👤</span> Con người</button>
    <button class="nav-item" data-view="positions"><span class="nav-ico">⚖</span> Chức vụ</button>
    <button class="nav-item" data-view="procedures"><span class="nav-ico">📋</span> Thủ tục</button>
    <button class="nav-item" data-view="documents"><span class="nav-ico">📜</span> Văn bản</button>
    <button class="nav-item" data-view="licenses"><span class="nav-ico">📄</span> Giấy phép</button>
    <button class="nav-item" data-view="sources"><span class="nav-ico">🔗</span> Nguồn</button>
    <button class="nav-item" data-view="help"><span class="nav-ico">❓</span> Hướng dẫn</button>
    <div class="nav-footer">
      <span class="badge badge-muted">Phase 1 — ứng dụng rỗng</span>
    </div>
  </nav>

  <main id="app">
    <div id="breadcrumbs" class="breadcrumbs"></div>
    <section id="view-root" class="view-root" aria-live="polite"></section>
  </main>

  <aside id="detail-panel" class="detail-panel is-empty">
    <div class="panel-head">
      <h2 class="panel-title">Chi tiết</h2>
      <button id="detail-close" class="icon-btn" aria-label="Đóng">✕</button>
    </div>
    <div id="detail-body" class="panel-body"></div>
  </aside>

</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

[],"source_ids":["source-410"],"effective_from":null,"effective_to":"2025-02-28","notes":""},{"id":"rel-085","from":"org-chinhphu-vn","to":"org-uy-ban-dan-toc","type":"supervises","label":{"vi":"quản lý / chỉ đạo (đến 28/02/2025)"},"legal_basis":[],"source_ids":["source-410"],"effective_from":null,"effective_to":"2025-02-28","notes":""}],"procedures":[{"id":"procedure-cap-phieu-lltp-so-1","name":{"vi":"Cấp Phiếu lý lịch tư pháp số 1 cho công dân Việt Nam"},"status":"active","applicant":{"types":["individual"]},"responsible_organization_id":"org-bo-cong-an","receiving_organization_id":"org-bo-cong-an","steps":[{"id":"step-01","order":1,"name":"Chuẩn bị và kê khai thông tin","actor":"applicant","description":"Kê khai tờ khai yêu cầu cấp Phiếu lý lịch tư pháp; chọn hình thức nộp: trực tuyến (VNeID / cổng dịch vụ công), trực tiếp hoặc qua bưu chính.","required_documents":[],"duration":null},{"id":"step-02","order":2,"name":"Nộp hồ sơ","actor":"applicant","description":"Nộp tại Công an cấp tỉnh nơi thường trú/tạm trú. Trường hợp không xác định được nơi thường trú/tạm trú hoặc là người nước ngoài từng cư trú tại Việt Nam thì nộp tại Cục Hồ sơ nghiệp vụ Bộ Công an.","required_documents":[],"duration":null},{"id":"step-03","order":3,"name":"Nộp lệ phí","actor":"applicant","description":"200.000 đồng/lần; 100.000 đồng với học sinh từ 16 tuổi, sinh viên, người có công, thân nhân liệt sĩ; miễn phí với trẻ em, người cao tuổi, người khuyết tật, hộ nghèo/cận nghèo và cư dân xã đặc biệt khó khăn. Từ phiếu thứ 3 trở đi trong 1 lần nộp: +5.000 đồng/phiếu.","required_documents":[],"duration":null},{"id":"step-04","order":4,"name":"Cơ quan Công an tra cứu, xác minh","actor":"organization","description":"Tra cứu thông tin lý lịch tư pháp trong cơ sở dữ liệu; phối hợp xác minh khi cần.","required_documents":[],"duration":"05 ngày làm việc (theo báo chí dẫn Luật sửa đổi — ⚠️ chưa đối chiếu trực tiếp điều luật)","organization_id":"org-bo-cong-an"},{"id":"step-05","order":5,"name":"Trả kết quả","actor":"organization","description":"Nhận Phiếu lý lịch tư pháp số 1 bản giấy hoặc bản điện tử (2 bản có giá trị pháp lý như nhau kể từ 01/7/2026).","required_documents":[],"duration":null,"organization_id":"org-bo-cong-an"}],"requirements":["Thẻ căn cước / căn cước công dân hoặc hộ chiếu còn giá trị","Tờ khai yêu cầu cấp Phiếu lý lịch tư pháp theo mẫu","Giấy tờ chứng minh thuộc diện miễn/giảm lệ phí (nếu có)"],"fees":["200.000 đồng/lần (mức thông thường)","100.000 đồng/lần (học sinh từ 16 tuổi, sinh viên, người có công, thân nhân liệt sĩ)","Miễn phí: trẻ em, người cao tuổi, người khuyết tật, hộ nghèo/cận nghèo, cư dân xã đặc biệt khó khăn","Phiếu thứ 3 trở đi trong cùng lần nộp: +5.000 đồng/phiếu"],"result":["Phiếu lý lịch tư pháp số 1 (bản giấy hoặc bản điện tử)"],"forms":[],"legal_basis":["Luật Lý lịch tư pháp 2009","Luật số 107/2025/QH15 sửa đổi, bổ sung một số điều của Luật Lý lịch tư pháp (hiệu lực 01/7/2026)","Thông tư 101/2026/TT-BCA (biểu mẫu, áp dụng từ 01/7/2026)"],"source_ids":["source-310","source-311","source-312"],"last_verified":"2026-09-18","notes":"⚠️ THAY ĐỔI LỚN: từ 01/7/2026, thẩm quyền cấp Phiếu lý lịch tư pháp chuyển từ Sở Tư pháp (Bộ Tư pháp) sang CƠ QUAN CÔNG AN (Cục Hồ sơ nghiệp vụ Bộ Công an và Công an cấp tỉnh) theo Luật 107/2025/QH15. Mọi hướng dẫn cũ ghi 'nộp tại Sở Tư pháp' đều đã lỗi thời. Thời hạn 05 ngày làm việc lấy từ báo chí, CHƯA đối chiếu trực tiếp điều luật — cần xác minh lại.","legal_basis_ids":["doc-luat-lltp-2009","doc-luat-107-2025-qh15","doc-tt-101-2026-ttbca"]},{"id":"procedure-dang-ky-thanh-lap-cong-ty-tnhh-mtv","name":{"vi":"Đăng ký thành lập doanh nghiệp — công ty TNHH một thành viên"},"status":"active","applicant":{"types":["individual","organization"]},"responsible_organization_id":"org-bo-tai-chinh","receiving_organization_id":null,"steps":[{"id":"step-01","order":1,"name":"Chuẩn bị hồ sơ","actor":"applicant","description":"Soạn giấy đề nghị đăng ký doanh nghiệp, điều lệ công ty, giấy tờ pháp lý của chủ sở h
