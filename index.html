<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VN Admin Map — Sơ đồ bộ máy hành chính Việt Nam</title>
<link rel="stylesheet" href="./css/main.css">
<link rel="stylesheet" href="./css/layout.css">
<link rel="stylesheet" href="./css/components.css">
<link rel="stylesheet" href="./css/graph.css">
<link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

<header id="app-header">
  <button id="nav-toggle" class="icon-btn" aria-label="Mở menu">☰</button>
  <div class="brand">
    <span class="brand-mark">VN</span>
    <span class="brand-text">Sơ đồ bộ máy hành chính</span>
  </div>
  <div class="search-box">
    <input id="global-search" type="search" placeholder="Tìm cơ quan, người, chức vụ, thủ tục, văn bản…" autocomplete="off" disabled>
    <span class="search-hint">Phase 5</span>
    <div id="search-results" class="search-results" hidden></div>
  </div>
  <button id="theme-toggle" class="icon-btn" aria-label="Đổi giao diện sáng/tối">◐</button>
</header>

<div id="app-body">

  <nav id="main-nav" aria-label="Điều hướng chính">
    <button class="nav-item is-active" data-view="map"><span class="nav-ico">🗺</span> Bản đồ</button>
    <button class="nav-item" data-view="organizations"><span class="nav-ico">🏢</span> Cơ quan</button>
    <button class="nav-item" data-view="people"><span class="nav-ico">👤</span> Con người</button>
    <button class="nav-item" data-view="positions"><span class="nav-ico">⚖</span> Chức vụ</button>
    <button class="nav-item" data-view="procedures"><span class="nav-ico">📋</span> Thủ tục</button>
    <button class="nav-item" data-view="documents"><span class="nav-ico">📜</span> Văn bản</button>
    <button class="nav-item" data-view="licenses"><span class="nav-ico">📄</span> Giấy phép</button>
    <button class="nav-item" data-view="sources"><span class="nav-ico">🔗</span> Nguồn</button>
    <button class="nav-item" data-view="help"><span class="nav-ico">❓</span> Hướng dẫn</button>
    <div class="nav-footer">
      <span class="badge badge-muted">Phase 1 — ứng dụng rỗng</span>
    </div>
  </nav>

  <main id="app">
    <div id="breadcrumbs" class="breadcrumbs"></div>
    <section id="view-root" class="view-root" aria-live="polite"></section>
  </main>

  <aside id="detail-panel" class="detail-panel is-empty">
    <div class="panel-head">
      <h2 class="panel-title">Chi tiết</h2>
      <button id="detail-close" class="icon-btn" aria-label="Đóng">✕</button>
    </div>
    <div id="detail-body" class="panel-body"></div>
  </aside>

</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
